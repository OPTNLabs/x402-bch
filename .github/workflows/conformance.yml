name: Cross-language conformance

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: packages/rust
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ python3 cmake make libgmp-dev
      - name: Install JavaScript dependencies
        run: npm ci --prefix packages/typescript
      - name: Run cross-language parity
        env:
          X402_REQUIRE_GO: '1'
        run: node tools/check-parity.mjs
      - name: Run TypeScript checks
        run: npm --prefix packages/typescript run check
      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path packages/rust/Cargo.toml -- --check
          cargo test --manifest-path packages/rust/Cargo.toml --locked --all-features --lib
