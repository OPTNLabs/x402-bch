[package]
name = "x402-chain-bch"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bitcoin Cash exact payment support for the x402 payment protocol"
readme = "README.md"

[dependencies]
alloy-primitives = { workspace = true }
bip39 = { version = "2.2.2" }
x402-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
hmac = { version = "0.12.1" }
thiserror = { workspace = true }
base64 = { version = "0.22.1" }
hex = { version = "0.4" }
ripemd = { version = "0.1.3" }
secp256k1 = { version = "0.31.1" }
sha2 = { version = "0.10.9" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.77"
tokio = { version = "1.35", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[features]
# FulcrumWebSocketTransport: ws:// and wss:// Fulcrum servers on native builds.
websocket = ["dep:futures-util", "dep:rustls", "dep:tokio-tungstenite", "dep:webpki-roots"]

[lib]
crate-type = ["rlib", "cdylib"]
